name: Infrastructure CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev, stg, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
      branch:
        description: 'Branch to deploy'
        required: true
        default: '15032026_aws_kiro_opensearch'
        options:
          - 15032026_aws_kiro_opensearch

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0
  STATE_BUCKET: dev-opensearch-navco-search-tfstate

jobs:
  deploy:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy Infrastructure' || 'Deploy Infrastructure' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create Terraform State Bucket
        run: |
          aws s3api create-bucket \
            --bucket ${{ env.STATE_BUCKET }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Bucket already exists"
          aws s3api put-bucket-versioning \
            --bucket ${{ env.STATE_BUCKET }} \
            --versioning-configuration Status=Enabled

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      # ============================================================
      # DESTROY PATH
      # ============================================================

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ./infra
        run: |
          terraform destroy \
            -var="env=${{ github.event.inputs.environment }}" \
            -auto-approve
        continue-on-error: true

      - name: Empty S3 Documents Bucket (required before destroy)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          BUCKET="${{ github.event.inputs.environment }}-opensearch-navco-search-documents-bucket"
          echo "Emptying bucket: $BUCKET"
          aws s3 rm s3://$BUCKET --recursive 2>/dev/null || echo "Bucket already empty or does not exist"

      - name: Destroy Summary
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          echo "## Destroy Complete" >> $GITHUB_STEP_SUMMARY
          echo "All resources for environment **${{ github.event.inputs.environment }}** have been destroyed." >> $GITHUB_STEP_SUMMARY
          echo "The Terraform state bucket (${{ env.STATE_BUCKET }}) was intentionally kept." >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # DEPLOY PATH
      # ============================================================

      - name: Build Lambda Layer
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          set -e
          LAYER_DIR="infra/lambda_layers/opensearch"
          SITE_PACKAGES="$LAYER_DIR/python/lib/python3.13/site-packages"

          echo "Creating directory structure..."
          mkdir -p "$SITE_PACKAGES"

          echo "Installing Python packages..."
          if [ -f "$LAYER_DIR/python/requirements.txt" ]; then
            pip install -r "$LAYER_DIR/python/requirements.txt" -t "$SITE_PACKAGES" --no-cache-dir --quiet
            echo "Lambda layer built successfully"
            echo "Installed packages:"
            ls "$SITE_PACKAGES"
          else
            echo "ERROR: requirements.txt not found at $LAYER_DIR/python/requirements.txt"
            exit 1
          fi

      - name: Terraform Format
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        run: terraform fmt -recursive

      - name: Terraform Validate
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        run: |
          terraform plan \
            -var="env=${{ github.event.inputs.environment }}" \
            -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        id: tf_outputs
        run: |
          INDEX_BOOTSTRAP=$(terraform output -json index_bootstrap_lambda_name | jq -r '.')
          echo "index_bootstrap_lambda=${INDEX_BOOTSTRAP}" >> $GITHUB_OUTPUT
          echo "Captured bootstrap lambda: $INDEX_BOOTSTRAP"

      - name: Invoke Index Bootstrap Lambda
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          aws lambda invoke \
            --function-name ${{ steps.tf_outputs.outputs.index_bootstrap_lambda }} \
            --region ${{ env.AWS_REGION }} \
            /tmp/bootstrap_response.json
          echo "Bootstrap Lambda Response:"
          cat /tmp/bootstrap_response.json

      - name: Wait for OpenSearch Indexes
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: sleep 15

      - name: Get Final Outputs
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        id: final_outputs
        run: |
          API_ENDPOINT=$(terraform output -json api_endpoint | jq -r '.')
          SEARCH_ENDPOINT=$(terraform output -json search_endpoint | jq -r '.')
          SUGGESTIONS_ENDPOINT=$(terraform output -json suggestions_endpoint | jq -r '.')
          KB_ID=$(terraform output -json knowledge_base_id | jq -r '.')
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "search_endpoint=$SEARCH_ENDPOINT" >> $GITHUB_OUTPUT
          echo "suggestions_endpoint=$SUGGESTIONS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "knowledge_base_id=$KB_ID" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base:** ${{ steps.final_outputs.outputs.api_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Search:** ${{ steps.final_outputs.outputs.search_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Suggestions:** ${{ steps.final_outputs.outputs.suggestions_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bedrock Knowledge Base" >> $GITHUB_STEP_SUMMARY
          echo "- **Knowledge Base ID:** ${{ steps.final_outputs.outputs.knowledge_base_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Test search: \`curl '${{ steps.final_outputs.outputs.search_endpoint }}?query=test'\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Test suggestions: \`curl '${{ steps.final_outputs.outputs.suggestions_endpoint }}?prefix=te'\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload a JSON file to S3 to trigger ingestion" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Terraform Plan Files
        if: always()
        working-directory: ./infra
        run: rm -f tfplan
